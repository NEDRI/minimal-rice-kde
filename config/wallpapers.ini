# Which wallpaper goes where. Paths are relative to wallpapers/ in this repo; install.sh copies pictures/ to
# ~/Pictures/Wallpapers and packages/ to ~/.local/share/wallpapers. Screen 0 is the main screen.
[Screens]
0=pictures/disco-ruud-wallpaper-4k.png
1=packages/Nothing1
[LockScreen]
Image=pictures/1920x1080.jpg
