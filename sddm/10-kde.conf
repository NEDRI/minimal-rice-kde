# SDDM zamiast plasma-login-manager (2026-11-17): user chce motywów z „Pobierz nowe…” (sddm-kcm).
# Greeter na Waylandzie przez KWin (Arch Wiki „SDDM#Running under Wayland”), nie domyślny X11.
# Klawiatura ASUS N-KEY bywała martwa na greeterze SDDM (hid_asus) — znany kompromis, nie blacklistować bez pytania.
# Powrót: sudo systemctl disable sddm && sudo systemctl enable plasmalogin
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=lorien-black
CursorTheme=Bibata-Modern-Ice
